<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Stakes Poker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- AUTH -->
<section id="view-auth" class="view">
  <div class="auth-card">
    <h1>&#9824; Table Stakes</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log In</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="form-login" class="tab-panel active">
      <input type="text" id="login-username" placeholder="Username" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <form id="form-register" class="tab-panel">
      <input type="text" id="register-username" placeholder="Username" required>
      <input type="email" id="register-email" placeholder="Email (optional)">
      <input type="password" id="register-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
  </div>
</section>

<!-- LOBBY -->
<section id="view-lobby" class="view hidden">
  <header class="topbar">
    <h1>&#9824; Table Stakes</h1>
    <div class="user-pill">
      <span id="lobby-username"></span>
      <span id="lobby-admin-badge" class="badge hidden">ADMIN</span>
      <button id="btn-my-history" class="btn-link">My Stats</button>
      <button id="btn-logout" class="btn-link">Log Out</button>
    </div>
  </header>

  <div class="lobby-grid">
    <div class="card">
      <h2>Create a Room</h2>
      <form id="form-create-room">
        <input type="text" id="create-room-name" placeholder="Room name" required>
        <label class="field-label">Max players</label>
        <input type="number" id="create-room-max" value="6" min="2" max="9">
        <label class="field-label">Small / Big blind</label>
        <div class="row">
          <input type="number" id="create-room-sb" value="10" min="1">
          <input type="number" id="create-room-bb" value="20" min="1">
        </div>
        <label class="field-label">Starting chips</label>
        <input type="number" id="create-room-chips" value="1000" min="1">
        <button type="submit" class="btn-primary">Create &amp; Join</button>
      </form>
    </div>

    <div class="card">
      <h2>Join by Code</h2>
      <form id="form-join-code">
        <input type="text" id="join-room-code" placeholder="ROOM CODE" maxlength="10" style="text-transform:uppercase">
        <button type="submit" class="btn-primary">Join</button>
      </form>
      <p class="hint">Invite-only tables need the admin to add your username first.</p>
    </div>

    <div class="card wide">
      <h2>Public Rooms</h2>
      <div id="public-rooms-list" class="rooms-list"><p class="muted">Loading&hellip;</p></div>
    </div>
  </div>
</section>

<!-- TABLE -->
<section id="view-table" class="view hidden">
  <header class="topbar">
    <button id="btn-leave-table" class="btn-link">&larr; Lobby</button>
    <div id="table-room-name" class="room-title"></div>
    <div class="user-pill">
      <span id="table-pot-badge" class="badge gold">Pot: 0</span>
      <button id="btn-deal" class="btn-primary small">Deal Hand</button>
    </div>
  </header>

  <div class="table-layout">
    <div class="table-felt-wrap">
      <div class="table-felt" id="table-felt">
        <div class="community-cards" id="community-cards"></div>
        <div class="pot-display" id="pot-display">Pot: 0</div>
        <div id="seats"></div>
      </div>

      <div class="action-bar hidden" id="action-bar">
        <div class="my-turn-indicator" id="my-turn-indicator">Your turn</div>
        <button id="btn-fold" class="btn-action fold">Fold</button>
        <button id="btn-check" class="btn-action">Check</button>
        <button id="btn-call" class="btn-action">Call</button>
        <div class="raise-controls">
          <input type="range" id="raise-slider" min="0" max="1000" value="0">
          <input type="number" id="raise-amount" min="0" value="0">
          <button id="btn-raise" class="btn-action raise">Raise</button>
        </div>
      </div>
    </div>

    <aside class="side-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-panel="chat">Chat</button>
        <button class="panel-tab" data-panel="log">Hand Log</button>
        <button class="panel-tab" data-panel="history">History</button>
      </div>

      <div id="panel-chat" class="panel-body active">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="form-chat">
          <input type="text" id="chat-input" placeholder="Say something&hellip;" autocomplete="off">
        </form>
      </div>

      <div id="panel-log" class="panel-body">
        <div id="hand-log" class="log-list"></div>
      </div>

      <div id="panel-history" class="panel-body">
        <div id="hand-history" class="log-list"></div>
      </div>
    </aside>
  </div>
</section>

<!-- ADMIN INVITE MODAL -->
<div id="modal-invite" class="modal hidden">
  <div class="modal-box">
    <h2>Invite to Private Table</h2>
    <form id="form-invite">
      <input type="text" id="invite-username" placeholder="Username to invite" required>
      <button type="submit" class="btn-primary">Invite</button>
    </form>
    <div id="invite-list" class="invite-list"></div>
    <button id="btn-close-invite" class="btn-link">Close</button>
  </div>
</div>

<!-- MY STATS MODAL -->
<div id="modal-stats" class="modal hidden">
  <div class="modal-box">
    <h2>My Stats</h2>
    <div id="stats-body"></div>
    <button id="btn-close-stats" class="btn-link">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
